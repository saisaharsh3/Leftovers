name: Bug report
description: Something in the app doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please leave out real financial details and personal information.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Plan
        2. Tap Subscriptions
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of Settings, e.g. 1.1.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: e.g. Pixel 8, Android 16
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Optional. Please hide any personal details first.
