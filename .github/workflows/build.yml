name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# The build only needs to read the code.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: leftovers-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # Each push to dev is published as a "Dev build" pre-release with the APK attached, so it can be
  # downloaded and installed straight from the phone. It never replaces the real latest release.
  dev-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Leftovers Dev (optimized like a release), signed with the release key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release.jks
            export SIGNING_STORE_FILE=release.jks
          fi
          ./gradlew assembleDev -PdevNumber=${{ github.run_number }} --stacktrace
          rm -f release.jks

      - name: Publish the Dev build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/dev/app-dev.apk leftovers-dev.apk
          # The notes list what's new since the last release: the Unreleased section of the changelog.
          {
            echo "Test build of the dev branch ($(git rev-parse --short HEAD)), built $(date -u +'%d %b %Y %H:%M') UTC."
            echo "Installs as **Leftovers Dev** (amber icon) next to the real app, with its own data. Not for everyday use."
            echo
            echo "## New since the last release"
            echo
            awk '/^## Unreleased/{on=1; next} /^## /{if (on) exit} on' CHANGELOG.md
          } > dev-notes.md
          title="Dev build $(date -u +'%d %b %H:%M') UTC"
          if gh release view dev-build >/dev/null 2>&1; then
            # Update the one Dev build in place instead of deleting and recreating it, so the release and its
            # download link stay the same. Apps that track releases (Komi Store, Obtainium) kept a link to the
            # deleted one and failed with 404.
            git tag -f dev-build "$GITHUB_SHA"
            git push -f origin refs/tags/dev-build
            gh release upload dev-build leftovers-dev.apk --clobber
            gh release edit dev-build --prerelease --title "$title" --notes-file dev-notes.md
            # GitHub shows the date a release was first published. Publishing it again from a draft moves that
            # date to now, while the release, its file and its download link stay the same.
            gh release edit dev-build --draft=true
            gh release edit dev-build --draft=false --prerelease
          else
            gh release create dev-build leftovers-dev.apk --prerelease --target "$GITHUB_SHA" --title "$title" --notes-file dev-notes.md
          fi

      - name: Keep this Dev build as its own pre-release, to go back to later
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')-dev.${{ github.run_number }}"
          tag="dev-$version"
          cp leftovers-dev.apk "leftovers-$version.apk"
          {
            echo "Leftovers Dev **$version**, built $(date -u +'%d %b %Y %H:%M') UTC from $(git rev-parse --short HEAD)."
            echo
            echo "An older Dev build, kept so you can go back to it: install this APK over any Leftovers Dev, newer or older. Your Dev data stays."
            echo "For the newest Dev build, use [Dev build](https://github.com/${{ github.repository }}/releases/tag/dev-build)."
          } > keep-notes.md
          gh release create "$tag" "leftovers-$version.apk" --prerelease --latest=false --target "$GITHUB_SHA" --title "Dev $version" --notes-file keep-notes.md
          # The newest 30 are kept; older ones (and their tags) go.
          gh release list --limit 200 --json tagName --jq '.[].tagName' | grep '^dev-[0-9]' | sort -t. -k4 -n -r | tail -n +31 |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
