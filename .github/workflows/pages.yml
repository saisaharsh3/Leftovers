# Publishes the website (website/) to GitHub Pages at https://saisaharsh3.github.io/Leftovers/
# whenever main changes it. Screenshots and the icon are copied in from where the app keeps them.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/screenshots/**"
      - "docs/icon.svg"
      - "docs/social-preview.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp website/* _site/
          cp docs/screenshots/*.jpg docs/icon.svg docs/social-preview.png _site/assets/
          # The same screens in the light theme, shown when the page is light.
          mkdir -p _site/assets/light && cp docs/screenshots/light/*.jpg _site/assets/light/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
